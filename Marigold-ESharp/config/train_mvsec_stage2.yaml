base_config:
  - config/common.yaml
  - config/dataset/mvsec_pseudo.yaml

max_iter: 20000
lr: 3.0e-6

trainer:
  validation_period: 500
  visualization_period: 500

eval:
  alignment: absolute

loss:
  affine_identity:
    enabled: false
  calibration:
    enabled: true
    freeze_backbone: false
    head_lr_scale: 3.0
    hidden_dim: 32
    t_max_m: 20.0
    lambda_st: 0.7
    lambda_t: 1.0
    lambda_metric: 0.3
    warmup_iters: 0
    ramp_iters: 2000
    histogram_period: 200
    apply_in_validation: true
