# Stage-I GT evaluation: use train_diffused_lotus_d.py --validate-only --resume <checkpoint>.
seed: 2026
output_dir: /path/to/runs/lotus_dsec_stage1_gt_eval

model:
  pretrained_path: /path/to/models/lotus-depth-d-v1-0

data:
  marigold_root: /path/to/repository/Marigold-ESharp
  marigold_config: config/eval_dsec_stage1_gt.yaml
  base_data_dir: /path/to/data
  input_key: rgb_norm
  depth_key: depth_filled_norm
  mask_key: valid_mask_filled
  num_workers: 4

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 40000
  timestep: 999
  learning_rate: 3.0e-5
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 200
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  mixed_precision: fp16
  gradient_checkpointing: true
  depth_loss_weight: 1.0
  reconstruction_loss_weight: 1.0
  checkpoint_every: 2000

logging:
  report_to: none
  project: diffused-lotus-dsec
  entity: null
  run_name: diffused-lotus-d-dsec-da2-lidar-old-nbin

validation:
  every: 2000
  seed: 2026
  max_batches: null
  metrics:
    - clip_compare_abs_rel
    - clip_compare_sq_rel
    - clip_compare_rmse
    - clip_compare_rmse_log
    - clip_compare_silog
    - clip_compare_delta1_acc
    - clip_compare_delta2_acc
    - clip_compare_delta3_acc

visualization:
  every: 2000
  max_samples: 5
  depth_vis_min_m: 2.0
  depth_vis_max_m: 100.0
